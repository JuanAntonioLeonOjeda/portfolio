<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Juan Antonio León Ojeda, desarrollador full-stack: proyectos, trayectoria y stack."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Juan Antonio León Ojeda</title>
    <script>
      // Theme and language before the first paint, so a dark or English choice never flashes.
      // Kept in step with src/features/shell/theme.ts and language.ts.
      (function () {
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem("portfolio-tema");
          lang = localStorage.getItem("portfolio-idioma");
        } catch (e) {
          /* storage blocked: the system theme and the browser language apply */
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (lang !== "es" && lang !== "en") {
          lang = /^es\b/i.test(navigator.language) ? "es" : "en";
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
